steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nexus-legal-api:$BUILD_ID', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nexus-legal-api:$BUILD_ID']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nexus-legal-api'
      - '--image=gcr.io/$PROJECT_ID/nexus-legal-api:$BUILD_ID'
      - '--region=us-central1'
      - '--service-account=drive-sheets@ortega-473114.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=ortega-473114:us-central1:nexus-legal-db'
      # Cambio de flag aquí: de --use-startup-cpu-boost a --cpu-boost
      - '--cpu-boost' 
      - '--set-env-vars=GUNICORN_CMD_ARGS=--timeout 90 --workers 2 --threads 4,APP_ENV=production,LOG_LEVEL=INFO,EXTERNAL_DISPATCH_ENABLED=true,EXTERNAL_DISPATCH_URL=https://enqueuer-api-907757756276.us-central1.run.app/enqueue'
      - '--set-secrets=CLICKUP_API_TOKEN=CLICKUP_API_TOKEN:latest,CLICKUP_WEBHOOK_SECRET=CLICKUP_WEBHOOK_SECRET:latest,CLICKUP_WEBHOOK_SECRET_ASSIGNMENTS=CLICKUP_WEBHOOK_SECRET_ASSIGNMENTS:latest,FILTROS_API_KEY=FILTROS_API_KEY:latest'
      - '--memory=2Gi'
      - '--cpu=1'

images:
  - 'gcr.io/$PROJECT_ID/nexus-legal-api:$BUILD_ID'